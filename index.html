<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Laundry">
<meta name="theme-color" content="#f0ede6">
<title>Laundry</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'DM Sans',sans-serif;background:#f0ede6;min-height:100vh;color:#1a1a18;overscroll-behavior:none;padding-bottom:env(safe-area-inset-bottom);}

.tabs{display:flex;background:#e6e3db;border-bottom:1px solid #d3d1c7;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);}
.tab{flex:1;padding:14px 6px;font-size:clamp(12px,3.5vw,14px);font-weight:500;text-align:center;cursor:pointer;color:#888780;border:none;background:none;font-family:inherit;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.tab.active{color:#1a1a18;border-bottom-color:#1a1a18;}

.page{display:none;padding:1.25rem 1rem 4rem;max-width:520px;margin:0 auto;width:100%;}
.page.active{display:block;}

.page-title{font-family:'DM Serif Display',serif;font-size:clamp(22px,6vw,28px);color:#1a1a18;margin-bottom:3px;}
.page-sub{font-size:12px;color:#888780;margin-bottom:1.25rem;}

.date-row{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap;}
.date-label{font-size:13px;color:#888780;white-space:nowrap;}
.date-input{flex:1;min-width:140px;border:1px solid #d3d1c7;border-radius:8px;padding:9px 10px;font-size:14px;font-family:inherit;background:#fff;color:#1a1a18;outline:none;}
.date-input:focus{border-color:#888780;}

.total-bar{background:#fff;border-radius:14px;padding:13px 16px;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;border:1px solid #e2e0d8;}
.total-label{font-size:13px;color:#888780;}
.total-num{font-size:22px;font-weight:600;}

.section-label{font-size:11px;font-weight:600;color:#aaa9a0;text-transform:uppercase;letter-spacing:.08em;margin:1rem 0 8px;}

.grid{display:flex;flex-direction:column;gap:8px;}
.item{background:#fff;border:1px solid #e2e0d8;border-radius:14px;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.item-left{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
.icon-box{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.name{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.btn{width:30px;height:30px;border-radius:50%;border:1px solid #d3d1c7;background:#f0ede6;cursor:pointer;font-size:19px;color:#1a1a18;display:flex;align-items:center;justify-content:center;line-height:1;transition:background .1s,transform .08s;user-select:none;padding:0;font-family:inherit;flex-shrink:0;}
.btn:active{transform:scale(.88);background:#dddbd4;}
.count{font-size:15px;font-weight:600;min-width:22px;text-align:center;}
.count.nz{color:#185FA5;}

.custom-item{background:#fff;border:1px dashed #d3d1c7;border-radius:14px;padding:11px 12px;display:flex;align-items:center;gap:8px;}
.custom-name-input{flex:1;min-width:0;border:none;outline:none;font-size:13.5px;font-weight:500;font-family:inherit;background:transparent;color:#1a1a18;}
.custom-name-input::placeholder{color:#bbb;}
.remove-btn{background:none;border:none;cursor:pointer;font-size:18px;color:#ccc;padding:0 2px;flex-shrink:0;line-height:1;}
.remove-btn:active{color:#c0392b;}

.add-custom-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;padding:12px;background:none;border:1.5px dashed #d3d1c7;border-radius:14px;cursor:pointer;font-size:13px;font-weight:500;color:#888780;font-family:inherit;transition:background .12s;}
.add-custom-btn:active{background:#e8e5de;}

.bottom-row{margin-top:1.5rem;display:flex;flex-direction:column;gap:8px;}
.action-btn{width:100%;padding:13px;font-size:14px;font-family:inherit;border-radius:10px;cursor:pointer;font-weight:600;transition:background .12s,transform .08s;border:1px solid #d3d1c7;text-align:center;}
.action-btn:active{transform:scale(.97);}
.save-btn{background:#1a1a18;color:#f0ede6;border-color:#1a1a18;}
.save-btn:active{background:#333;}
.reset-btn{background:#f0ede6;color:#888780;}
.reset-btn:active{background:#dddbd4;}

.h-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;gap:8px;}
.h-title{font-family:'DM Serif Display',serif;font-size:clamp(22px,6vw,28px);}
.clear-all{font-size:12px;color:#c0392b;background:none;border:1px solid #f0c8c8;border-radius:7px;padding:6px 11px;cursor:pointer;font-family:inherit;flex-shrink:0;}
.clear-all:active{background:#fdeaea;}

.empty-state{text-align:center;padding:3rem 1rem;color:#aaa9a0;font-size:14px;line-height:1.9;}
.entry-card{background:#fff;border:1px solid #e2e0d8;border-radius:14px;padding:14px;margin-bottom:10px;}
.entry-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
.entry-date-wrap{display:flex;align-items:center;gap:8px;min-width:0;flex:1;}
.entry-date-text{font-weight:600;font-size:13px;white-space:nowrap;}
.entry-date-edit{border:1px solid #d3d1c7;border-radius:7px;padding:4px 6px;font-size:12px;font-family:inherit;background:#fff;}
.entry-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.entry-badge{font-size:11px;background:#f0ede6;border-radius:6px;padding:3px 8px;color:#888780;white-space:nowrap;}
.icon-btn{background:none;border:none;cursor:pointer;font-size:15px;color:#aaa;line-height:1;padding:3px 5px;}
.icon-btn:active{color:#1a1a18;}
.icon-btn.danger:active{color:#c0392b;}

.entry-items{display:flex;flex-wrap:wrap;gap:6px;}
.entry-chip{display:flex;align-items:center;gap:5px;font-size:12px;background:#f5f3ef;border-radius:7px;padding:4px 9px;color:#555;}
.chip-count{font-weight:600;color:#1a1a18;}

/* editable entry state */
.entry-edit-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#f9f8f5;border-radius:9px;padding:8px 10px;margin-bottom:6px;}
.entry-edit-name{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.entry-edit-controls{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.mini-btn{width:26px;height:26px;border-radius:50%;border:1px solid #d3d1c7;background:#fff;cursor:pointer;font-size:16px;color:#1a1a18;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;font-family:inherit;}
.mini-btn:active{transform:scale(.88);background:#e8e5de;}
.mini-count{font-size:14px;font-weight:600;min-width:20px;text-align:center;}
.entry-actions-row{display:flex;gap:8px;margin-top:10px;}
.entry-action-btn{flex:1;padding:9px;font-size:12px;font-family:inherit;border-radius:8px;cursor:pointer;font-weight:600;border:1px solid #d3d1c7;}
.entry-action-btn:active{transform:scale(.97);}
.done-btn{background:#1a1a18;color:#f0ede6;border-color:#1a1a18;}
.done-btn:active{background:#333;}

.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a18;color:#f0ede6;font-size:13px;padding:10px 20px;border-radius:20px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;z-index:100;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (max-width:360px){
  .name{font-size:12.5px;}
  .btn{width:28px;height:28px;font-size:18px;}
  .controls{gap:6px;}
}
</style>
</head>
<body>

<div class="tabs">
  <button class="tab active" onclick="switchTab('counter')">Counter</button>
  <button class="tab" onclick="switchTab('history')">History</button>
</div>

<div class="page active" id="page-counter">
  <p class="page-title">Laundry Counter</p>
  <p class="page-sub">Set counts then save to history</p>
  <div class="date-row">
    <span class="date-label">Date given</span>
    <input type="date" class="date-input" id="laundry-date">
  </div>
  <div class="total-bar">
    <span class="total-label">Total items</span>
    <span class="total-num" id="total">0</span>
  </div>

  <div class="section-label">Clothing</div>
  <div class="grid" id="grid-main"></div>

  <div class="section-label">Essentials</div>
  <div class="grid" id="grid-essentials"></div>

  <div class="section-label">Custom</div>
  <div class="grid" id="grid-custom"></div>
  <button class="add-custom-btn" onclick="addCustom()">+ Add category</button>

  <div class="bottom-row">
    <button class="action-btn save-btn" onclick="saveEntry()">Save to history</button>
    <button class="action-btn reset-btn" onclick="resetCounters()">Reset counters</button>
  </div>
</div>

<div class="page" id="page-history">
  <div class="h-top">
    <p class="h-title">Past Laundry</p>
    <button class="clear-all" onclick="clearAllHistory()">Clear all</button>
  </div>
  <div id="history-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const MAIN_ITEMS = [
  {id:'half_pant',    label:'Half pants',    icon:'🩳', bg:'#E6F1FB'},
  {id:'full_pant',    label:'Full pants',    icon:'👖', bg:'#EAF3DE'},
  {id:'jeans',        label:'Jeans',         icon:'🔵', bg:'#DBEAFE'},
  {id:'tshirt',       label:'T-shirts',      icon:'👕', bg:'#FBEAF0'},
  {id:'towel',        label:'Towels',        icon:'🛁', bg:'#FAEEDA'},
  {id:'blanket',      label:'Blanket',       icon:'🛏', bg:'#E1F5EE'},
  {id:'pillow_cover', label:'Pillow covers', icon:'💤', bg:'#EEEDFE'},
  {id:'bedsheet',     label:'Bedsheet',      icon:'🪡', bg:'#FAECE7'},
];

const ESSENTIAL_ITEMS = [
  {id:'vest',         label:'Vest',          icon:'🎽', bg:'#FEF3C7'},
  {id:'underwear',    label:'Underwear',     icon:'🩲', bg:'#FCE7F3'},
  {id:'socks',        label:'Socks',         icon:'🧦', bg:'#E0F2FE'},
  {id:'napkin',       label:'Napkin',        icon:'🧻', bg:'#ECFDF5'},
  {id:'handkerchief', label:'Handkerchief',  icon:'🤧', bg:'#EFF6FF'},
];

const CUSTOM_BGS = ['#FFF7ED','#F0FDF4','#FDF4FF','#FFFBEB','#F0F9FF','#FFF1F2'];

let counts = {};
[...MAIN_ITEMS, ...ESSENTIAL_ITEMS].forEach(it => counts[it.id] = 0);
let customItems = [];
let editingEntryId = null; // which history entry is currently in edit mode

const todayStr = () => new Date().toISOString().split('T')[0];
document.getElementById('laundry-date').value = todayStr();

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Counter page ────────────────────────────────────────────────────────
function renderGrid(items, gridId) {
  const grid = document.getElementById(gridId);
  grid.innerHTML = '';
  items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML =
      '<div class="item-left">' +
        '<div class="icon-box" style="background:' + item.bg + '">' + item.icon + '</div>' +
        '<span class="name">' + item.label + '</span>' +
      '</div>' +
      '<div class="controls">' +
        '<button class="btn" onclick="change(\'' + item.id + '\',-1)">−</button>' +
        '<span class="count ' + (counts[item.id] > 0 ? 'nz' : '') + '" id="cnt-' + item.id + '">' + counts[item.id] + '</span>' +
        '<button class="btn" onclick="change(\'' + item.id + '\',1)">+</button>' +
      '</div>';
    grid.appendChild(el);
  });
}

function renderCustomGrid() {
  const grid = document.getElementById('grid-custom');
  grid.innerHTML = '';
  customItems.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'custom-item';
    el.innerHTML =
      '<div class="icon-box" style="background:' + CUSTOM_BGS[i % CUSTOM_BGS.length] + '">✏️</div>' +
      '<input class="custom-name-input" placeholder="Category name" value="' + escHtml(item.label) + '" oninput="renameCustom(' + i + ', this.value)">' +
      '<div class="controls">' +
        '<button class="btn" onclick="changeCustom(' + i + ',-1)">−</button>' +
        '<span class="count ' + (item.count > 0 ? 'nz' : '') + '" id="ccnt-' + i + '">' + item.count + '</span>' +
        '<button class="btn" onclick="changeCustom(' + i + ',1)">+</button>' +
        '<button class="remove-btn" onclick="removeCustom(' + i + ')">×</button>' +
      '</div>';
    grid.appendChild(el);
  });
}

function renderAll() {
  renderGrid(MAIN_ITEMS, 'grid-main');
  renderGrid(ESSENTIAL_ITEMS, 'grid-essentials');
  renderCustomGrid();
  updateTotal();
}

function updateTotal() {
  let total = 0;
  [...MAIN_ITEMS, ...ESSENTIAL_ITEMS].forEach(it => total += counts[it.id]);
  customItems.forEach(it => total += it.count);
  document.getElementById('total').textContent = total;
}

function change(id, delta) {
  counts[id] = Math.max(0, counts[id] + delta);
  const el = document.getElementById('cnt-' + id);
  if (el) { el.textContent = counts[id]; el.className = 'count' + (counts[id] > 0 ? ' nz' : ''); }
  updateTotal();
}

function changeCustom(i, delta) {
  customItems[i].count = Math.max(0, customItems[i].count + delta);
  const el = document.getElementById('ccnt-' + i);
  if (el) { el.textContent = customItems[i].count; el.className = 'count' + (customItems[i].count > 0 ? ' nz' : ''); }
  updateTotal();
}

function renameCustom(i, val) { customItems[i].label = val; }

function addCustom() {
  customItems.push({ label: '', count: 0 });
  renderCustomGrid();
  updateTotal();
  const inputs = document.querySelectorAll('.custom-name-input');
  if (inputs.length) inputs[inputs.length - 1].focus();
}

function removeCustom(i) {
  customItems.splice(i, 1);
  renderCustomGrid();
  updateTotal();
}

function resetCounters() {
  [...MAIN_ITEMS, ...ESSENTIAL_ITEMS].forEach(it => counts[it.id] = 0);
  customItems.forEach(it => it.count = 0);
  renderAll();
  showToast('Counters reset');
}

// ── History storage ───────────────────────────────────────────────────
function getHistory() {
  try { return JSON.parse(localStorage.getItem('laundry_history') || '[]'); }
  catch(e) { return []; }
}

function setHistory(h) {
  localStorage.setItem('laundry_history', JSON.stringify(h));
}

function saveEntry() {
  const total = [...MAIN_ITEMS, ...ESSENTIAL_ITEMS].reduce((s,it) => s + counts[it.id], 0)
    + customItems.reduce((s,it) => s + it.count, 0);
  if (total === 0) { showToast('Add at least one item first'); return; }
  const date = document.getElementById('laundry-date').value || todayStr();
  const snapshot = [
    ...[...MAIN_ITEMS, ...ESSENTIAL_ITEMS].map(it => ({ label: it.label, icon: it.icon, count: counts[it.id] })),
    ...customItems.map(it => ({ label: it.label || 'Unnamed', icon: '✏️', count: it.count }))
  ].filter(it => it.count > 0);
  const history = getHistory();
  history.unshift({ id: Date.now(), date, items: snapshot });
  setHistory(history);
  showToast('Saved to history!');
  resetCounters();
}

// ── History rendering + inline editing ──────────────────────────────────
function formatDate(str) {
  if (!str) return 'Unknown date';
  const d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
}

function entryTotal(entry) {
  return (entry.items || []).reduce((s, it) => s + it.count, 0);
}

function renderHistory() {
  const list = document.getElementById('history-list');
  const history = getHistory();
  if (!history.length) {
    list.innerHTML = '<div class="empty-state">No past laundry yet.<br>Save your first batch from the Counter tab.</div>';
    return;
  }
  list.innerHTML = '';
  history.forEach(entry => {
    const card = document.createElement('div');
    card.className = 'entry-card';

    if (editingEntryId === entry.id) {
      // EDIT MODE
      const rows = (entry.items || []).map((it, idx) =>
        '<div class="entry-edit-row">' +
          '<span class="entry-edit-name">' + it.icon + ' ' + escHtml(it.label) + '</span>' +
          '<div class="entry-edit-controls">' +
            '<button class="mini-btn" onclick="editEntryItem(' + entry.id + ',' + idx + ',-1)">−</button>' +
            '<span class="mini-count">' + it.count + '</span>' +
            '<button class="mini-btn" onclick="editEntryItem(' + entry.id + ',' + idx + ',1)">+</button>' +
          '</div>' +
        '</div>'
      ).join('');
      card.innerHTML =
        '<div class="entry-header">' +
          '<div class="entry-date-wrap">' +
            '<input type="date" class="entry-date-edit" value="' + escHtml(entry.date || '') + '" onchange="editEntryDate(' + entry.id + ', this.value)">' +
          '</div>' +
          '<span class="entry-right"><span class="entry-badge">' + entryTotal(entry) + ' items</span></span>' +
        '</div>' +
        rows +
        '<div class="entry-actions-row">' +
          '<button class="entry-action-btn done-btn" onclick="finishEditEntry()">Done</button>' +
        '</div>';
    } else {
      // VIEW MODE
      const chips = (entry.items || []).map(it =>
        '<div class="entry-chip"><span>' + it.icon + ' ' + escHtml(it.label) + '</span><span class="chip-count">× ' + it.count + '</span></div>'
      ).join('');
      card.innerHTML =
        '<div class="entry-header">' +
          '<span class="entry-date-text">' + formatDate(entry.date) + '</span>' +
          '<span class="entry-right">' +
            '<span class="entry-badge">' + entryTotal(entry) + ' items</span>' +
            '<button class="icon-btn" title="Edit" onclick="startEditEntry(' + entry.id + ')">✎</button>' +
            '<button class="icon-btn danger" title="Delete" onclick="deleteEntry(' + entry.id + ')">✕</button>' +
          '</span>' +
        '</div>' +
        '<div class="entry-items">' + (chips || '<span style="font-size:12px;color:#bbb;">No items</span>') + '</div>';
    }
    list.appendChild(card);
  });
}

function startEditEntry(id) {
  editingEntryId = id;
  renderHistory();
}

function finishEditEntry() {
  editingEntryId = null;
  renderHistory();
  showToast('Updated');
}

function editEntryItem(entryId, itemIdx, delta) {
  const history = getHistory();
  const entry = history.find(e => e.id === entryId);
  if (!entry) return;
  entry.items[itemIdx].count = Math.max(0, entry.items[itemIdx].count + delta);
  setHistory(history);
  renderHistory();
}

function editEntryDate(entryId, newDate) {
  const history = getHistory();
  const entry = history.find(e => e.id === entryId);
  if (!entry) return;
  entry.date = newDate;
  setHistory(history);
}

function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  const history = getHistory().filter(e => e.id !== id);
  setHistory(history);
  renderHistory();
}

function clearAllHistory() {
  if (!confirm('Delete all history? This cannot be undone.')) return;
  localStorage.removeItem('laundry_history');
  renderHistory();
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['counter','history'][i] === tab));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  if (tab === 'history') { editingEntryId = null; renderHistory(); }
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

renderAll();
</script>
</body>
</html>
